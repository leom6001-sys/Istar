name: Update M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pycryptodome urllib3

      - name: Delete old M3U and Run Script
        run: |
          rm -f istar_playlist.m3u
          python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add istar_playlist.m3u
          git commit -m "Auto-update playlist files" || echo "No changes to commit"
          git push
