name: Update M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pycryptodome urllib3

      - name: Run Script
        run: |
          python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f mystar_playlist.enc ]; then
            git add mystar_playlist.enc
            git commit -m "Auto-update encrypted playlist file" || echo "No changes to commit"
            git push
          else
            echo "Skipping commit, file not found due to server block."
          fi
